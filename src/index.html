<!-- Define que este arquivo usa HTML moderno. -->
<!doctype html>
<!-- lang indica que o conteúdo principal da página está em inglês. -->
<html lang="en">
<head>
  <!-- Permite que caracteres especiais sejam exibidos corretamente. -->
  <meta charset="utf-8">
  <!-- Texto mostrado na aba do navegador. -->
  <title>GeradorCertificado</title>
  <!-- Faz os caminhos relativos da aplicação serem resolvidos a partir da raiz. -->
  <base href="/">
  <!-- Ajusta o layout para acompanhar a largura real de celulares e tablets. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Ícone pequeno exibido na aba do navegador. -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Biblioteca externa que fornece os ícones da família Phosphor. -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
</head>
<!-- Corpo: aqui o Angular monta toda a interface da aplicação. -->
<body>
  <!-- app-root é a tag criada pelo componente principal da aplicação Angular. -->
  <app-root></app-root>
</body>
</html>
